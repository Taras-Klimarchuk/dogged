services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  warehouse:
    build:
      context: .
      dockerfile: apps/warehouse/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3002:3002'
    networks:
      - backend-net

  orders-management:
    build:
      context: .
      dockerfile: apps/orders-management/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      warehouse:
        condition: service_started
    ports:
      - '3001:3001'
    networks:
      - backend-net
      - edge-net

  terminal:
    build:
      context: .
      dockerfile: apps/terminal/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    depends_on:
      orders-management:
        condition: service_started
    ports:
      - '3000:3000'
    networks:
      - edge-net

networks:
  # terminal <-> orders-management only
  edge-net:
  # orders-management <-> warehouse <-> postgres; terminal is never attached here,
  # so it has no network path to warehouse or the database, matching the diagrams.
  backend-net:

volumes:
  postgres-data:

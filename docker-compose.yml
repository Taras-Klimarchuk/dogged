services:
  terminal:
    build:
      context: .
      dockerfile: apps/terminal/Dockerfile
    environment:
      PORT: ${TERMINAL_PORT}
      TERMINAL_ID: ${TERMINAL_ID}
      ORDERS_MANAGEMENT_URL: ${ORDERS_MANAGEMENT_URL}
      MENU_CACHE_DB_PATH: ${MENU_CACHE_DB_PATH}
    ports:
      - "3000:3000"
    networks:
      - orders-management
  orders-management:
    build:
      context: .
      dockerfile: apps/orders-management/Dockerfile
    environment:
      PORT: ${ORDERS_MANAGEMENT_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ORDERS_DB_NAME: ${ORDERS_DB_NAME}
      KNOWN_TERMINAL_IDS: ${KNOWN_TERMINAL_IDS}
      WAREHOUSE_URL: ${WAREHOUSE_URL}
    ports:
      - "127.0.0.1:3001:3001"
    networks: [orders-management, warehouse, postgres]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - postgres
  warehouse:
    build:
      context: .
      dockerfile: apps/warehouse/Dockerfile
    environment:
      PORT: ${WAREHOUSE_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      ORDERS_MANAGEMENT_URL: ${ORDERS_MANAGEMENT_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    networks: [warehouse, postgres]
  prometheus:
    image: prom/prometheus:v3.13.4
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [orders-management, warehouse]
networks:
  orders-management:
  warehouse:
  postgres:

volumes:
  postgres_data:
  prometheus_data:
